<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Appointment | Aaradhya's Homoeopathy</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="topbar"><a class="brand" href="../index.html"><span class="brand-mark">✚</span><div><strong>Aaradhya's Homoeopathy</strong><small>Book consultation</small></div></a></header><main class="page"><div class="page-title"><span class="eyebrow">BOOK CONSULTATION / APPOINTMENT</span><h1>Choose your appointment</h1><p style="color:var(--muted)">Monday–Saturday: available after 5:00 PM up to 9:00 PM. Sunday: <b>online consultation only</b>.</p></div><div class="grid-2"><section class="panel"><h2 style="font-size:26px">Select date</h2><div class="date-row" id="dates"></div><div id="modeNotice" class="notice"></div><h3>Available slots</h3><div class="slot-grid" id="slots"></div><div id="selected" class="notice" style="display:none"></div></section><section class="panel"><h2 style="font-size:26px">Patient details</h2><div class="form-group"><label>Select doctor</label><select id="doctor">
<option value="reshma">Dr. Reshma Singh — MD (Hom) Kolkata</option>
<option value="op">Dr. O.P. Singh — MD (Hom) Kolkata</option>
</select></div><div class="form-group"><label>Full name</label><input id="name" placeholder="Patient name"></div><div class="form-group"><label>Mobile</label><input id="phone" inputmode="numeric" autocomplete="tel" placeholder="98765 43210"></div><div class="form-group"><label>Reason</label><textarea id="reason" rows="4" placeholder="Briefly describe your concern"></textarea></div><div class="form-group"><label>Consultation mode</label><select id="mode"><option value="offline">Offline — Clinic</option><option value="online">Online — Video Consultation</option></select></div><div class="form-group"><label>Payment preference</label><select id="payment"><option>Pay before appointment — UPI / QR</option><option>Pay after consultation</option></select></div><button class="btn btn-primary full" onclick="book()">Confirm Appointment</button></section></div></main><script src="../js/app.js"></script><script src="../js/config.js"></script><script>
let selectedDate='',selectedSlot='';
const weekdayTimes=['5:00 PM','5:15 PM','5:30 PM','5:45 PM','6:00 PM','6:15 PM','6:30 PM','6:45 PM','7:00 PM','7:15 PM','7:30 PM','7:45 PM','8:00 PM','8:15 PM','8:30 PM','8:45 PM'];
const sundayTimes=['9:00 AM','9:15 AM','9:30 AM','9:45 AM','10:00 AM','10:15 AM','10:30 AM','10:45 AM','11:00 AM','11:15 AM','11:30 AM','11:45 AM','12:00 PM','12:15 PM','12:30 PM','12:45 PM','1:00 PM','1:15 PM','1:30 PM','1:45 PM','2:00 PM','2:15 PM','2:30 PM','2:45 PM','3:00 PM','3:15 PM','3:30 PM','3:45 PM','4:00 PM','4:15 PM','4:30 PM','4:45 PM','5:00 PM','5:15 PM','5:30 PM','5:45 PM','6:00 PM','6:15 PM','6:30 PM','6:45 PM'];
let dateObjects=[];
function isSunday(d){return d.getDay()===0}
function localISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function renderDates(){
 const box=document.getElementById('dates');box.innerHTML='';dateObjects=[];
 for(let i=0;i<7;i++){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+i);dateObjects.push(d);
  const b=document.createElement('button');b.className='date-btn'+(i===0?' active':'');b.innerHTML='<small>'+d.toLocaleDateString('en-IN',{weekday:'short'})+'</small><b>'+d.getDate()+' '+d.toLocaleDateString('en-IN',{month:'short'})+'</b>';
  b.onclick=()=>{document.querySelectorAll('.date-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedDate=localISO(d);updateMode(d);renderSlots()};box.appendChild(b);if(i===0)selectedDate=localISO(d);
 }
}
function updateMode(d){
 const sunday=isSunday(d);document.getElementById('modeNotice').innerHTML=sunday?'<b>Sunday:</b> Online consultation only · 9:00 AM–7:00 PM':'<b>Monday–Saturday:</b> Clinic availability after 5:00 PM up to 9:00 PM';
 const mode=document.getElementById('mode');mode.disabled=sunday;if(sunday)mode.value='online';
}
function renderSlots(){
 const box=document.getElementById('slots');box.innerHTML='';const d=dateObjects.find(x=>localISO(x)===selectedDate);const times=isSunday(d)?sundayTimes:weekdayTimes;
 times.forEach(t=>{const b=document.createElement('button');b.className='slot';b.textContent=t;b.onclick=()=>{document.querySelectorAll('.slot').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selectedSlot=t;const s=document.getElementById('selected');s.style.display='block';s.textContent='Selected: '+selectedDate+' at '+t+(isSunday(d)?' — ONLINE ONLY':'')};box.appendChild(b)})
}
async function book(){
 const name=document.getElementById('name').value.trim();const mobile=document.getElementById('phone').value.trim();
 if(!name||!mobile||!selectedSlot)return alert('Please enter your name, mobile number and select a slot.');
 const d=dateObjects.find(x=>localISO(x)===selectedDate);const sunday=isSunday(d);
 const appointment={doctor:document.getElementById('doctor').value,mobile,name,phone:mobile,date:selectedDate,time:selectedSlot,duration:15,reason:document.getElementById('reason').value,mode:sunday?'online':document.getElementById('mode').value,payment:document.getElementById('payment').value,status:'Confirmed'};
 try{
   const result=await apiPost('bookAppointment',appointment);
   if(!result.configured||!result.ok){
     throw new Error(result.error||'Unable to save the appointment.');
   }

   const savedServer={
     ...appointment,
     ...(result.appointment||{}),
     patientId:result.appointment?.patientId||'',
     appointmentId:result.appointment?.appointmentId||'',
     patientCode:result.appointment?.patientCode||'',
     appointmentCode:result.appointment?.appointmentCode||''
   };

   localStorage.setItem('appointment',JSON.stringify(savedServer));
   location.href='confirmation.html';
 }catch(err){
   alert(err?.message||'Unable to save booking right now. Please try again.');
 }
}
const doctorParam=new URLSearchParams(location.search).get('doctor');if(doctorParam==='op'||doctorParam==='reshma')document.getElementById('doctor').value=doctorParam;
renderDates();updateMode(dateObjects[0]);renderSlots();
</script></body></html>
