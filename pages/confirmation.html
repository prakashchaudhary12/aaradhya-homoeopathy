<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Appointment Confirmed</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="login-wrap"><div class="login-card center"><div style="font-size:60px">✓</div><span class="eyebrow">BOOKING CONFIRMED</span><h1>Appointment booked</h1><div id="d" class="notice"></div><p style="color:var(--muted)">You can open your Google Meet link from the patient dashboard.</p><a class="btn btn-primary full" href="patient-dashboard.html">Go to Patient Dashboard</a></div></main><script>const a=JSON.parse(localStorage.getItem('appointment')||'{}');const doctorName=a.doctor==='op'?'Dr. O.P. Singh':'Dr. Reshma Singh';document.getElementById('d').innerHTML='<b>'+(a.name||'Patient')+'</b><br>'+doctorName+'<br>'+(a.date||'')+' at '+(a.time||'')+'<br><span class="badge green">'+(a.payment||'Payment')+'</span>';</script></body></html>
