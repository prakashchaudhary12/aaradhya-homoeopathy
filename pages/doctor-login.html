<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doctor Login | Aaradhya's Homoeopathy</title><link rel="stylesheet" href="../css/style.css"></head>
<body>
<header class="topbar"><a class="brand" href="../index.html"><span class="brand-mark">✚</span><div><strong>Aaradhya's Homoeopathy</strong><small>Doctor portal</small></div></a><a class="btn btn-outline" href="../index.html">Back to website</a></header>
<main class="login-wrap"><div class="login-card">
<span class="eyebrow">DOCTOR PORTAL</span><h1>Doctor Login</h1>
<p style="color:var(--muted)">Use the registered mobile number and password provided for your doctor account.</p>
<div class="form-group"><label>Mobile number</label><input id="mobile" type="tel" inputmode="tel" autocomplete="tel" placeholder="98765 43210"></div>
<div class="form-group"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter password"></div>
<button id="loginBtn" class="btn btn-primary full" onclick="login()">Login to Doctor Dashboard</button><div id="msg" class="notice" style="display:none;margin-top:14px"></div><p class="center"><a href="forgot-password.html?role=doctor">Forgot Password?</a></p>
</div></main>
<script src="../js/config.js"></script>
<script>
function cleanPhone(v){
 const digits=String(v||'').replace(/\D/g,'');
 if(digits.length===10)return '+91'+digits;
 if(digits.length===12&&digits.startsWith('91'))return '+'+digits;
 return String(v||'').trim();
}
async function login(){
 const phone=cleanPhone(document.getElementById('mobile').value),password=document.getElementById('password').value;
 const msg=document.getElementById('msg');
 if(msg) msg.style.display='block';
 if(phone.replace(/\D/g,'').length<10)return msg.textContent='Please enter a valid mobile number.';
 if(!password)return msg.textContent='Please enter your password.';
 document.getElementById('loginBtn').disabled=true;
 try{
  const sb=await getSupabaseClient();
  const result=await sb.auth.signInWithPassword({phone,password});
  if(result.error)throw result.error;
  const claim=await sb.rpc('claim_doctor_account_by_phone');
  if(claim.error)throw claim.error;
  localStorage.setItem('doctorProfile',JSON.stringify(claim.data));
  location.href='doctor-dashboard.html';
 }catch(e){msg.textContent=e.message||'Unable to sign in.';}
 finally{document.getElementById('loginBtn').disabled=false;}
}
</script></body></html>
