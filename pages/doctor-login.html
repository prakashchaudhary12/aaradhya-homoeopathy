<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doctor Login | Aaradhya's Homoeopathy</title><link rel="stylesheet" href="../css/style.css"></head>
<body>
<header class="topbar"><a class="brand" href="../index.html"><span class="brand-mark">✚</span><div><strong>Aaradhya's Homoeopathy</strong><small>Doctor portal</small></div></a><a class="btn btn-outline" href="../index.html">Back to website</a></header>
<main class="login-wrap"><div class="login-card">
<span class="eyebrow">DOCTOR PORTAL</span><h1>Doctor Login</h1>
<p style="color:var(--muted)">Use the mobile number registered for the selected doctor.</p>
<div class="form-group"><label>Doctor</label><select id="doctor"><option value="reshma">Dr. Reshma Singh — MD (Hom) Kolkata</option><option value="op">Dr. O.P. Singh — MD (Hom) Kolkata</option></select></div>
<div class="form-group"><label>Registered mobile number</label><input id="mobile" type="tel" inputmode="tel" placeholder="+91 98765 43210"></div>
<button id="sendBtn" class="btn btn-primary full" onclick="sendOtp()">Send OTP</button>
<div id="otpBox" style="display:none;margin-top:18px"><div class="form-group"><label>OTP</label><input id="otp" inputmode="numeric" maxlength="6" placeholder="Enter the 6-digit OTP"></div><button id="verifyBtn" class="btn btn-dark full" onclick="verifyOtp()">Verify & Continue</button></div>
<div id="msg" class="notice">The doctor's phone number must be registered in the Supabase doctors table.</div>
</div></main>
<script src="../js/config.js"></script>
<script>
function cleanPhone(v){return String(v||'').replace(/[^0-9+]/g,'');}
function showMsg(t){document.getElementById('msg').textContent=t;}
async function sendOtp(){
 const phone=cleanPhone(document.getElementById('mobile').value);
 if(phone.replace(/\\D/g,'').length<10){showMsg('Please enter a valid mobile number.');return;}
 document.getElementById('sendBtn').disabled=true;
 try{
   const sb=await getSupabaseClient();
   const result=await sb.auth.signInWithOtp({phone,options:{data:{role:'doctor'}}});
   if(result.error) throw result.error;
   document.getElementById('otpBox').style.display='block';
   showMsg('OTP sent. Enter the code received on the registered doctor mobile.');
 }catch(e){showMsg(e.message||'Unable to send code. Check Supabase Phone Auth and SMS provider settings.');}
 finally{document.getElementById('sendBtn').disabled=false;}
}
async function verifyOtp(){
 const phone=cleanPhone(document.getElementById('mobile').value), token=document.getElementById('otp').value.trim(), doctor=document.getElementById('doctor').value;
 if(token.length!==6){showMsg('Enter the 6-digit code.');return;}
 document.getElementById('verifyBtn').disabled=true;
 try{
   const sb=await getSupabaseClient();
   const result=await sb.auth.verifyOtp({phone,token,type:'sms'});
   if(result.error) throw result.error;
   const claim=await sb.rpc('claim_doctor_account',{p_doctor_code:doctor});
   if(claim.error) throw claim.error;
   localStorage.setItem('doctorProfile',JSON.stringify(claim.data));
   location.href='doctor-dashboard.html';
 }catch(e){showMsg(e.message||'Doctor verification failed.');}
 finally{document.getElementById('verifyBtn').disabled=false;}
}
</script></body></html>
