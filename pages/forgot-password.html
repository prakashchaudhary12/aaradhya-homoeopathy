<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot Password | Aaradhya's Homoeopathy</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header class="topbar">
<a class="brand" href="../index.html"><span class="brand-mark">✚</span><div><strong>Aaradhya's Homoeopathy</strong><small id="portalLabel">Account recovery</small></div></a>
</header>
<main class="login-wrap">
<div class="login-card">
<span class="eyebrow" id="eyebrow">ACCOUNT RECOVERY</span>
<h1 id="title">Forgot Password</h1>
<p style="color:var(--muted)">Enter the 10-digit mobile number registered with the clinic.</p>

<div class="form-group">
<label>Mobile number</label>
<input id="mobile" type="tel" inputmode="numeric" autocomplete="tel" placeholder="98765 43210">
</div>
<button id="sendBtn" class="btn btn-primary full" onclick="sendCode()">Send OTP</button>

<div id="resetBox" style="display:none;margin-top:18px">
<div class="form-group">
<label>OTP</label>
<input id="otp" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit OTP">
</div>
<div class="form-group">
<label>New password</label>
<input id="newPassword" type="text" autocomplete="new-password" placeholder="Minimum 8 characters">
</div>
<div class="form-group">
<label>Confirm password</label>
<input id="confirmPassword" type="text" autocomplete="new-password" placeholder="Repeat password">
</div>
<button id="resetBtn" class="btn btn-dark full" onclick="resetPassword()">Reset Password</button>
</div>

<div id="msg" class="notice">We'll send an OTP to the registered mobile number.</div>
<p class="center"><a id="backLink" href="login.html">← Back to login</a></p>
</div>
</main>

<script src="../js/config.js"></script>
<script>
const role=new URLSearchParams(location.search).get('role')==='doctor'?'doctor':'patient';
const portal=role==='doctor'?'Doctor':'Patient';
document.getElementById('eyebrow').textContent=portal.toUpperCase()+' PASSWORD RECOVERY';
document.getElementById('portalLabel').textContent=portal+' portal';
document.getElementById('title').textContent='Forgot Password';
document.getElementById('backLink').href=role==='doctor'?'doctor-login.html':'login.html';

function cleanPhone(v){
 const digits=String(v||'').replace(/\D/g,'');
 if(digits.length===10)return '+91'+digits;
 if(digits.length===12&&digits.startsWith('91'))return '+'+digits;
 return '';
}
function showMsg(text){document.getElementById('msg').textContent=text;}

async function sendCode(){
 const phone=cleanPhone(document.getElementById('mobile').value);
 if(!phone)return showMsg('Please enter a valid 10-digit mobile number.');
 document.getElementById('sendBtn').disabled=true;
 try{
  const result=await fetch(SUPABASE_URL+'/functions/v1/request-password-reset',{
   method:'POST',
   headers:{'Content-Type':'application/json', apikey:SUPABASE_PUBLISHABLE_KEY},
   body:JSON.stringify({role,phone})
  });
  const data=await result.json().catch(()=>({}));
  if(!result.ok||data.error)throw new Error(data.error||'Unable to request password reset.');
  document.getElementById('resetBox').style.display='block';
  showMsg('If this mobile number has an account, an OTP has been sent. Enter it below.');
 }catch(e){
  showMsg(e.message||'Unable to request password reset.');
 }finally{
  document.getElementById('sendBtn').disabled=false;
 }
}

async function resetPassword(){
 const phone=cleanPhone(document.getElementById('mobile').value);
 const token=document.getElementById('otp').value.trim();
 const password=document.getElementById('newPassword').value;
 const confirm=document.getElementById('confirmPassword').value;
 if(!phone)return showMsg('Please enter a valid mobile number.');
 if(token.length!==6)return showMsg('Enter the 6-digit OTP.');
 if(password.length<8)return showMsg('Password must be at least 8 characters.');
 if(password!==confirm)return showMsg('Passwords do not match.');
 document.getElementById('resetBtn').disabled=true;
 try{
  const sb=await getSupabaseClient();
  const result=await sb.auth.verifyOtp({phone,token,type:'sms'});
  if(result.error)throw result.error;

  const {data:userData,error:userError}=await sb.auth.getUser();
  if(userError||!userData.user)throw userError||new Error('Authentication failed.');

  const {data:profile}=await sb.from('profiles').select('role').eq('id',userData.user.id).maybeSingle();
  const actualRole=profile?.role||'';
  if(actualRole && actualRole!==role){
    await sb.auth.signOut();
    throw new Error('This mobile number belongs to a different account type.');
  }

  const updated=await sb.auth.updateUser({password});
  if(updated.error)throw updated.error;
  await sb.auth.signOut();

  showMsg('Password reset successfully. Redirecting to login...');
  setTimeout(()=>location.href=role==='doctor'?'doctor-login.html':'login.html',900);
 }catch(e){
  showMsg(e.message||'Unable to reset password. Please request a fresh OTP.');
 }finally{
  document.getElementById('resetBtn').disabled=false;
 }
}
</script>
</body>
</html>
