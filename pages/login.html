<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patient Login | Aaradhya's Homoeopathy</title><link rel="stylesheet" href="../css/style.css"></head>
<body>
<header class="topbar"><a class="brand" href="../index.html"><span class="brand-mark">✚</span><div><strong>Aaradhya's Homoeopathy</strong><small>Patient portal</small></div></a></header>
<main class="login-wrap"><div class="login-card">
<span class="eyebrow">PATIENT ACCESS</span>
<h1 id="title">Patient Login</h1>
<p style="color:var(--muted)">Use your mobile number and password to access your patient dashboard.</p>
<div class="form-group" id="nameWrap" style="display:none"><label>Full name</label><input id="name" autocomplete="name" placeholder="Patient name"></div>
<div class="form-group"><label>Mobile number</label><input id="mobile" type="tel" inputmode="tel" autocomplete="tel" placeholder="+91 98765 43210"></div>
<div class="form-group"><label>Password</label><input id="password" type="text" autocomplete="current-password" placeholder="Enter password"></div>
<div class="form-group" id="confirmWrap" style="display:none"><label>Confirm password</label><input id="confirm" type="text" autocomplete="new-password" placeholder="Repeat password"></div>
<button id="mainBtn" class="btn btn-primary full" onclick="submitForm()">Login</button>
<div id="msg" class="notice">New patient? Create an account using your mobile number and password.</div>
<p class="center"><button id="toggleBtn" class="text-link" style="background:none;border:0;cursor:pointer;font:inherit" onclick="toggleMode()">Create patient account</button></p>
</div></main>
<script src="../js/config.js"></script>
<script>
let signupMode=false;
function cleanPhone(v){
 const digits=String(v||'').replace(/\D/g,'');
 if(digits.length===10)return '+91'+digits;
 if(digits.length===12&&digits.startsWith('91'))return '+'+digits;
 return String(v||'').trim();
}
function showMsg(t){document.getElementById('msg').textContent=t;}
function toggleMode(){
 signupMode=!signupMode;
 document.getElementById('title').textContent=signupMode?'Create Patient Account':'Patient Login';
 document.getElementById('nameWrap').style.display=signupMode?'block':'none';
 document.getElementById('confirmWrap').style.display=signupMode?'block':'none';
 document.getElementById('mainBtn').textContent=signupMode?'Create Account':'Login';
 document.getElementById('toggleBtn').textContent=signupMode?'Back to patient login':'Create patient account';
}
async function submitForm(){
 const phone=cleanPhone(document.getElementById('mobile').value);
 const password=document.getElementById('password').value;
 const name=document.getElementById('name').value.trim();
 if(phone.replace(/\D/g,'').length<10)return showMsg('Please enter a valid mobile number.');
 if(password.length<8)return showMsg('Password must be at least 8 characters.');

 const button=document.getElementById('mainBtn');
 button.disabled=true;

 try{
  const sb=await getSupabaseClient();

  if(signupMode){
   if(!name)return showMsg('Please enter your full name.');
   if(password!==document.getElementById('confirm').value)return showMsg('Passwords do not match.');

   showMsg('Creating your patient account...');
   const result=await sb.auth.signUp({
     phone,
     password,
     options:{data:{full_name:name,role:'patient'}}
   });

   if(result.error)throw result.error;

   // We require an active session so the new account can immediately
   // be linked to a row in public.patients.
   if(!result.data.session){
     await sb.auth.signOut();
     throw new Error('Account was created, but Supabase is asking for phone confirmation. In Authentication → Providers → Phone, turn OFF "Enable phone confirmations" for this mobile + password setup.');
   }

   const claim=await sb.rpc('claim_patient_account');
   if(claim.error){
     await sb.auth.signOut();
     throw new Error('Account was created, but the patient database record could not be created: '+claim.error.message);
   }

   localStorage.setItem('patientProfile',JSON.stringify(claim.data));
   showMsg('Account created successfully. Opening your patient dashboard...');
  }else{
   showMsg('Signing in...');
   const result=await sb.auth.signInWithPassword({phone,password});
   if(result.error)throw result.error;

   const claim=await sb.rpc('claim_patient_account');
   if(claim.error)throw claim.error;

   localStorage.setItem('patientProfile',JSON.stringify(claim.data));
  }

  location.href='patient-dashboard.html';
 }catch(e){
  showMsg(e.message||'Unable to continue.');
 }finally{
  button.disabled=false;
 }
}
</script></body></html>
