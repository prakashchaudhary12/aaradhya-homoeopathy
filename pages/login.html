<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patient Login | Reshma HomeoCare</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="topbar"><a class="brand" href="../index.html"><span class="brand-mark">✚</span><div><strong>Reshma HomeoCare</strong><small>Patient portal</small></div></a></header><main class="login-wrap"><div class="login-card"><span class="eyebrow">PATIENT ACCESS</span><h1>Patient Login</h1><p style="color:var(--muted)">Enter your mobile number to continue.</p><div class="form-group"><label>Mobile number</label><input id="mobile" type="tel" placeholder="+91 98765 43210"></div><button class="btn btn-primary full" onclick="sendOtp()">Send OTP</button><div id="otpBox" style="display:none;margin-top:18px"><div class="form-group"><label>OTP</label><input id="otp" value="123456"></div><button class="btn btn-dark full" onclick="verifyOtp()">Verify & Continue</button></div><div class="notice">Demo OTP: <b>123456</b></div><p class="center"><a href="doctor-dashboard.html">Doctor/Tinky Dashboard →</a></p></div></main><script src="../js/app.js"></script><script>function sendOtp(){if(document.getElementById('mobile').value.replace(/\\D/g,'').length<10)return alert('Please enter a valid mobile number');document.getElementById('otpBox').style.display='block'}function verifyOtp(){if(document.getElementById('otp').value==='123456')location.href='patient-dashboard.html';else alert('Demo OTP is 123456')}</script></body></html>
