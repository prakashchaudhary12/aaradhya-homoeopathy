<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patient Login | Aaradhya's Homoeopathy</title><link rel="stylesheet" href="../css/style.css"></head>
<body><header class="topbar"><a class="brand" href="../index.html"><span class="brand-mark">✚</span><div><strong>Aaradhya's Homoeopathy</strong><small>Patient portal</small></div></a></header>
<main class="login-wrap"><div class="login-card">
<span class="eyebrow">PATIENT ACCESS</span><h1>Patient Login</h1>
<p style="color:var(--muted)">Sign in using the mobile number registered for your appointment.</p>
<div class="form-group"><label>Full name (first login only)</label><input id="name" placeholder="Patient name"></div>
<div class="form-group"><label>Mobile number</label><input id="mobile" type="tel" inputmode="tel" placeholder="+91 98765 43210"></div>
<button id="sendBtn" class="btn btn-primary full" onclick="sendOtp()">Send OTP</button>
<div id="otpBox" style="display:none;margin-top:18px">
<div class="form-group"><label>OTP</label><input id="otp" inputmode="numeric" maxlength="6" placeholder="Enter the 6-digit OTP"></div>
<button id="verifyBtn" class="btn btn-dark full" onclick="verifyOtp()">Verify & Continue</button>
</div>
<div id="msg" class="notice">An SMS OTP will be sent by Supabase after Phone Auth is enabled.</div>
<p class="center"><a href="doctor-login.html">Doctor Login →</a></p>
</div></main>
<script src="../js/config.js"></script>
<script>
function cleanPhone(v){return String(v||'').replace(/[^0-9+]/g,'');}
function showMsg(t){document.getElementById('msg').textContent=t;}
async function sendOtp(){
 const phone=cleanPhone(document.getElementById('mobile').value);
 const name=document.getElementById('name').value.trim();
 if(phone.replace(/\D/g,'').length<10){showMsg('Please enter a valid mobile number.');return;}
 document.getElementById('sendBtn').disabled=true;
 try{
   const sb=await getSupabaseClient();
   const {error}=await sb.auth.signInWithOtp({phone,options:{data:{full_name:name,role:'patient'}}});
   if(error) throw error;
   document.getElementById('otpBox').style.display='block';
   showMsg('OTP sent. Enter the code received on your mobile.');
 }catch(e){showMsg(e.message||'Unable to send OTP. Check that Supabase Phone Auth and an SMS provider are enabled.');}
 finally{document.getElementById('sendBtn').disabled=false;}
}
async function verifyOtp(){
 const phone=cleanPhone(document.getElementById('mobile').value), token=document.getElementById('otp').value.trim();
 const name=document.getElementById('name').value.trim();
 if(token.length!==6){showMsg('Enter the 6-digit OTP.');return;}
 document.getElementById('verifyBtn').disabled=true;
 try{
   const sb=await getSupabaseClient();
   const {data,error}=await sb.auth.verifyOtp({phone,token,type:'sms'});
   if(error) throw error;
   if(name){await sb.auth.updateUser({data:{full_name:name,role:'patient'}});}
   const {data:claim,error:claimError}=await sb.rpc('claim_patient_account');
   if(claimError) throw claimError;
   localStorage.setItem('patientProfile',JSON.stringify(claim));
   location.href='patient-dashboard.html';
 }catch(e){showMsg(e.message||'OTP verification failed.');}
 finally{document.getElementById('verifyBtn').disabled=false;}
}
</script></body></html>
