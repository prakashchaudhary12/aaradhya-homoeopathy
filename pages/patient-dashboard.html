<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patient Dashboard</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="topbar"><a class="brand" href="../index.html"><span class="brand-mark">✚</span><div><strong>Reshma HomeoCare</strong><small>Patient portal</small></div></a><a class="btn btn-primary" href="booking.html">Book Appointment</a></header><main class="page"><div class="page-title"><span class="eyebrow">PATIENT DASHBOARD</span><h1>Welcome, <span id="n">Patient</span></h1></div><div class="dashboard-grid"><div class="stat"><small>Next appointment</small><strong id="t">—</strong></div><div class="stat"><small>Doctor</small><strong>Dr. Reshma</strong></div><div class="stat"><small>Status</small><strong style="font-size:20px">Confirmed</strong></div><div class="stat"><small>Prescription</small><strong style="font-size:20px">Available</strong></div></div><div class="grid-2"><section class="panel"><h2 style="font-size:25px">Upcoming appointment</h2><div id="a" class="notice"></div><button class="btn btn-dark" onclick="window.open('https://meet.google.com/','_blank')">Join Google Meet</button></section><section class="panel"><h2 style="font-size:25px">Latest prescription</h2><div class="rx"><b>Dr. Reshma Singh</b><div class="medicine-row"><span>Arnica 30</span><span>As advised</span></div><div class="medicine-row"><span>Rhus Tox 30</span><span>As advised</span></div></div><button class="btn btn-primary" onclick="alert('Medicine request sent.')">Request Medicines</button></section></div></main><script>const a=JSON.parse(localStorage.getItem('appointment')||'{}');document.getElementById('n').textContent=a.name||'Patient';document.getElementById('t').textContent=a.time||'—';document.getElementById('a').innerHTML='<b>'+(a.date||'No appointment')+'</b><br>'+(a.time||'')+'<br>Dr. Reshma Singh<br><span class="badge green">'+(a.status||'Confirmed')+'</span>';</script></body></html>
