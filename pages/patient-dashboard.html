<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patient Dashboard | Aaradhya's Homoeopathy</title><link rel="stylesheet" href="../css/style.css"></head>
<body>
<header class="topbar"><a class="brand" href="../index.html"><span class="brand-mark">✚</span><div><strong>Aaradhya's Homoeopathy</strong><small>Patient portal</small></div></a><nav><button class="btn btn-outline" onclick="logout()">Logout</button><a class="btn btn-primary" href="booking.html">Book Appointment</a></nav></header>
<main class="page">
<div class="page-title"><span class="eyebrow">PATIENT DASHBOARD</span><h1>Welcome, <span id="n">Patient</span></h1><p id="phoneText" style="color:var(--muted)"></p></div>
<div class="dashboard-grid"><div class="stat"><small>Next appointment</small><strong id="t">—</strong></div><div class="stat"><small>Doctor</small><strong id="doctorName">—</strong></div><div class="stat"><small>Status</small><strong id="status" style="font-size:20px">—</strong></div><div class="stat"><small>Prescriptions</small><strong id="rxCount" style="font-size:20px">0</strong></div></div>
<section class="panel"><h2 style="font-size:25px">Upcoming appointment</h2><div id="a" class="notice">Loading...</div><button id="meetBtn" class="btn btn-dark" style="display:none" onclick="joinMeet()">Join Google Meet</button></section>
<section class="panel" style="margin-top:22px"><h2 style="font-size:25px">My appointments</h2><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Time</th><th>Doctor</th><th>Mode</th><th>Status</th><th>Payment</th></tr></thead><tbody id="appointmentHistory"></tbody></table></div></section>
<section class="panel" style="margin-top:22px"><h2 style="font-size:25px">My prescriptions</h2><div id="prescriptionList"><p style="color:var(--muted)">Loading prescriptions...</p></div></section>
<section class="panel" style="margin-top:22px"><h2 style="font-size:25px">Medicine request</h2><textarea id="orderNotes" rows="3" style="width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font:inherit" placeholder="Enter the medicines you need"></textarea><button class="btn btn-primary" style="margin-top:12px" onclick="requestMedicines()">Request Medicines</button><div id="orderMsg" class="notice" style="display:none"></div></section>
</main>
<script src="../js/config.js"></script>
<script>
let latestAppointment=null;
async function init(){
 try{
  const sb=await getSupabaseClient();
  const session=await sb.auth.getSession();
  if(!session.data.session){location.href='login.html';return;}
  const claim=await sb.rpc('claim_patient_account');
  if(claim.error) throw claim.error;
  const profile=claim.data||{};
  document.getElementById('n').textContent=profile.fullName||'Patient';
  document.getElementById('phoneText').textContent=profile.phone||'';

  // One-time recovery for an appointment created by an older version of the site
  // that stored the booking only in browser localStorage.
  try{
    const legacy=JSON.parse(localStorage.getItem('appointment')||'null');
    if(legacy && legacy.doctor && legacy.date && legacy.time){
      await sb.rpc('sync_my_legacy_booking',{
        p_doctor_code:legacy.doctor,
        p_appointment_date:legacy.date,
        p_appointment_time:legacy.time,
        p_reason:legacy.reason||null,
        p_mode:legacy.mode||'offline',
        p_payment_preference:legacy.payment||null
      });
    }
  }catch(_){}

  const r=await apiGet('appointments');
  if(!r.ok) throw new Error(r.error||'Unable to load appointments');
  const apps=r.data||[], today=new Date().toISOString().slice(0,10);
  document.getElementById('appointmentHistory').innerHTML=apps.length
   ? apps.map(x=>'<tr><td>'+escapeHtml(x.Date)+'</td><td>'+escapeHtml(x.Time)+'</td><td>'+escapeHtml(x['Doctor Name'])+'</td><td>'+escapeHtml(x.Mode)+'</td><td>'+escapeHtml(x.Status)+'</td><td>'+escapeHtml(x['Payment Status'])+'</td></tr>').join('')
   : '<tr><td colspan="6">No appointments found for this account.</td></tr>';
  latestAppointment=apps.find(x=>String(x.Date)>=today&&x.Status!=='Cancelled'&&x.Status!=='Completed')||apps[0];
  if(latestAppointment){
   const dn=latestAppointment['Doctor Name']||(latestAppointment.Doctor==='op'?'Dr. O.P. Singh':'Dr. Reshma Singh');
   document.getElementById('doctorName').textContent=dn;
   document.getElementById('t').textContent=(latestAppointment.Date||'')+' '+(latestAppointment.Time||'');
   document.getElementById('status').textContent=latestAppointment.Status||'Confirmed';
   document.getElementById('a').innerHTML='<b>'+escapeHtml(latestAppointment.Date)+'</b><br>'+escapeHtml(latestAppointment.Time)+'<br>'+escapeHtml(dn)+'<br>'+escapeHtml(latestAppointment.Mode)+'<br><span class="badge green">'+escapeHtml(latestAppointment.Status)+'</span>';
   if(latestAppointment['Meet Link'])document.getElementById('meetBtn').style.display='inline-flex';
  }else{
   document.getElementById('status').textContent='—';document.getElementById('a').textContent='No appointments found.';
  }
  await loadPrescriptions();
 }catch(e){document.getElementById('a').textContent=e.message||'Unable to load your dashboard.';}
}
async function loadPrescriptions(){
 const r=await apiGet('prescriptions');
 if(!r.ok){document.getElementById('prescriptionList').textContent=r.error||'Unable to load prescriptions.';return;}
 const list=r.data||[];document.getElementById('rxCount').textContent=list.length;
 const box=document.getElementById('prescriptionList');
 box.innerHTML=list.length?list.map(x=>'<div class="rx"><b>'+escapeHtml(x['Prescription Code'])+'</b><div>'+escapeHtml(x.Date)+' · '+escapeHtml(x.Doctor)+'</div>'+((x.Diagnosis||'')?'<div style="margin-top:7px"><b>Diagnosis:</b> '+escapeHtml(x.Diagnosis)+'</div>':'')+((x.Advice||'')?'<div style="margin-top:7px"><b>Advice:</b> '+escapeHtml(x.Advice)+'</div>':'')+'</div>').join(''):'<p style="color:var(--muted)">No prescriptions available yet.</p>';
}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function joinMeet(){if(latestAppointment&&latestAppointment['Meet Link'])window.open(latestAppointment['Meet Link'],'_blank');else alert('The doctor has not added a Google Meet link yet.');}
async function requestMedicines(){
 const notes=document.getElementById('orderNotes').value.trim(); if(!notes)return alert('Enter the medicines you need.');
 const m=document.getElementById('orderMsg');
 try{const r=await apiPost('createOrder',{items:[{request:notes}],notes});if(!r.ok)throw new Error(r.error);m.style.display='block';m.textContent='Medicine request submitted.';document.getElementById('orderNotes').value='';}
 catch(e){m.style.display='block';m.textContent=e.message||'Unable to submit medicine request.';}
}
async function logout(){const sb=await getSupabaseClient();try{await sb.rpc('clear_admin_test_portal');}catch(_){}await sb.auth.signOut();location.href='login.html';}
init();
</script></body></html>
